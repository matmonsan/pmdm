<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#FFFFFF"/>

  <!-- Títulos -->
  <text x="150" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">MVC</text>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">MVP</text>
  <text x="750" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">MVVM</text>
  <line x1="300" y1="15" x2="300" y2="455" stroke="#CFD8DC" stroke-width="2"/>
  <line x1="600" y1="15" x2="600" y2="455" stroke="#CFD8DC" stroke-width="2"/>

  <!-- MVC -->
  <rect x="60" y="60" width="180" height="60" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="150" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Vista</text>
  <text x="150" y="108" text-anchor="middle" font-size="12" fill="#0D47A1">elementos de la pantalla</text>
  <rect x="60" y="200" width="180" height="60" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="150" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#BF360C">Controlador</text>
  <text x="150" y="248" text-anchor="middle" font-size="12" fill="#BF360C">recibe la Vista entera</text>
  <rect x="60" y="340" width="180" height="60" rx="10" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="150" y="368" text-anchor="middle" font-size="16" font-weight="bold" fill="#263238">Modelo</text>
  <text x="150" y="388" text-anchor="middle" font-size="12" fill="#263238">datos</text>
  <line x1="120" y1="122" x2="120" y2="198" stroke="#37474F" stroke-width="2" marker-end="url(#f)"/>
  <text x="112" y="165" text-anchor="end" font-size="12" fill="#37474F">eventos</text>
  <line x1="180" y1="198" x2="180" y2="122" stroke="#C62828" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="188" y="158" font-size="12" fill="#C62828">cambia los</text>
  <text x="188" y="173" font-size="12" fill="#C62828">elementos</text>
  <line x1="150" y1="262" x2="150" y2="338" stroke="#37474F" stroke-width="2" marker-end="url(#f)"/>
  <text x="150" y="430" text-anchor="middle" font-size="13" fill="#C62828">El controlador toca la pantalla</text>

  <!-- MVP -->
  <rect x="360" y="60" width="180" height="60" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="450" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Vista</text>
  <text x="450" y="108" text-anchor="middle" font-size="12" fill="#0D47A1">implementa una interfaz</text>
  <rect x="360" y="200" width="180" height="60" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="450" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#BF360C">Presentador</text>
  <text x="450" y="248" text-anchor="middle" font-size="12" fill="#BF360C">conoce solo la interfaz</text>
  <rect x="360" y="340" width="180" height="60" rx="10" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="450" y="368" text-anchor="middle" font-size="16" font-weight="bold" fill="#263238">Modelo</text>
  <text x="450" y="388" text-anchor="middle" font-size="12" fill="#263238">datos</text>
  <line x1="420" y1="122" x2="420" y2="198" stroke="#37474F" stroke-width="2" marker-end="url(#f)"/>
  <text x="412" y="165" text-anchor="end" font-size="12" fill="#37474F">eventos</text>
  <line x1="480" y1="198" x2="480" y2="122" stroke="#E65100" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="488" y="158" font-size="12" fill="#BF360C">vista.mostrar</text>
  <text x="488" y="173" font-size="12" fill="#BF360C">Colores(...)</text>
  <line x1="450" y1="262" x2="450" y2="338" stroke="#37474F" stroke-width="2" marker-end="url(#f)"/>
  <text x="450" y="430" text-anchor="middle" font-size="13" fill="#BF360C">El presentador llama a la vista</text>

  <!-- MVVM -->
  <rect x="660" y="60" width="180" height="60" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="750" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Vista</text>
  <text x="750" y="108" text-anchor="middle" font-size="12" fill="#0D47A1">composables</text>
  <rect x="660" y="200" width="180" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="750" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#1B5E20">ViewModel</text>
  <text x="750" y="248" text-anchor="middle" font-size="12" fill="#1B5E20">no conoce la vista</text>
  <rect x="660" y="340" width="180" height="60" rx="10" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="750" y="368" text-anchor="middle" font-size="16" font-weight="bold" fill="#263238">Modelo</text>
  <text x="750" y="388" text-anchor="middle" font-size="12" fill="#263238">datos</text>
  <line x1="720" y1="122" x2="720" y2="198" stroke="#37474F" stroke-width="2" marker-end="url(#f)"/>
  <text x="712" y="165" text-anchor="end" font-size="12" fill="#37474F">eventos</text>
  <line x1="780" y1="122" x2="780" y2="198" stroke="#2E7D32" stroke-width="2.5" stroke-dasharray="6 4" marker-start="url(#f)"/>
  <text x="788" y="158" font-size="12" fill="#1B5E20">observa</text>
  <text x="788" y="173" font-size="12" fill="#1B5E20">uiState</text>
  <line x1="750" y1="262" x2="750" y2="338" stroke="#37474F" stroke-width="2" marker-end="url(#f)"/>
  <text x="750" y="430" text-anchor="middle" font-size="13" fill="#1B5E20">La vista lee el estado</text>
</svg>
