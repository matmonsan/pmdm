<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#FFFFFF"/>

  <!-- Cabeceras -->
  <rect x="70" y="20" width="160" height="44" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="150" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#0D47A1">Vista</text>
  <rect x="370" y="20" width="160" height="44" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="450" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#1B5E20">ViewModel</text>
  <rect x="670" y="20" width="160" height="44" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="750" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#BF360C">Repositorio</text>

  <!-- Líneas de vida -->
  <line x1="150" y1="64" x2="150" y2="540" stroke="#90A4AE" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="450" y1="64" x2="450" y2="540" stroke="#90A4AE" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="750" y1="64" x2="750" y2="540" stroke="#90A4AE" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- 1 -->
  <rect x="40" y="85" width="220" height="50" rx="6" fill="#FFFFFF" stroke="#1565C0"/>
  <text x="150" y="106" text-anchor="middle" font-size="13" fill="#263238">1. El usuario pulsa «Borrar»</text>
  <text x="150" y="124" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#0D47A1">onBorrar()</text>

  <!-- 2 -->
  <line x1="152" y1="175" x2="446" y2="175" stroke="#C62828" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="300" y="164" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#263238">2. viewModel.onDeleteHotel(hotel)</text>
  <text x="300" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#C62828">EVENTO (sube)</text>

  <!-- 3 -->
  <line x1="452" y1="235" x2="746" y2="235" stroke="#37474F" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="600" y="224" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#263238">3. deleteHotel(hotel.id)</text>
  <text x="600" y="254" text-anchor="middle" font-size="12" fill="#546E7A">el repositorio borra el hotel</text>

  <!-- 4: recarga -->
  <line x1="748" y1="295" x2="454" y2="295" stroke="#37474F" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#flecha)"/>
  <text x="600" y="284" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#263238">4. getHotels() → 3 hoteles</text>

  <!-- 4: nuevo estado -->
  <rect x="300" y="320" width="300" height="70" rx="6" fill="#FFFFFF" stroke="#2E7D32"/>
  <text x="450" y="340" text-anchor="middle" font-size="12" fill="#263238">4. Nuevo estado:</text>
  <text x="450" y="359" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1B5E20">uiState = uiState.copy(</text>
  <text x="450" y="377" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1B5E20">  3 hoteles, selectedHotelId = null)</text>

  <!-- 5 -->
  <line x1="448" y1="430" x2="154" y2="430" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#flecha)"/>
  <text x="300" y="419" text-anchor="middle" font-size="12" fill="#263238">5. Compose detecta el nuevo uiState</text>
  <text x="300" y="449" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">ESTADO (baja)</text>

  <!-- 6 -->
  <rect x="40" y="470" width="220" height="56" rx="6" fill="#FFFFFF" stroke="#1565C0"/>
  <text x="150" y="492" text-anchor="middle" font-size="13" fill="#263238">6. Se redibuja la pantalla:</text>
  <text x="150" y="512" text-anchor="middle" font-size="12" fill="#263238">PantallaPrincipal con 3 hoteles</text>
</svg>
