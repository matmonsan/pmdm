<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="400" viewBox="0 0 1000 400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>text { white-space: pre; } .mono { font-family: Consolas, Menlo, monospace; }</style>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="flechaRoja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C62828"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#FFFFFF"/>

  <text x="500" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#263238">Devolver un dato a la pantalla anterior con savedStateHandle</text>
  <text x="500" y="50" text-anchor="middle" font-size="13" fill="#546E7A">Cada entrada de la pila tiene su propio almacén. A escribe en el de Inicio y después vuelve atrás.</text>

  <!-- Panel izquierdo: antes de volver -->
  <rect x="20" y="70" width="430" height="290" rx="10" fill="#F5F5F5" stroke="#B0BEC5"/>
  <text x="235" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">En A, al pulsar «Enviar y volver»</text>
  <text x="235" y="114" text-anchor="middle" font-size="12" fill="#546E7A">pila: [Inicio, A]</text>

  <rect x="45" y="140" width="130" height="50" rx="6" fill="#A5D6A7" stroke="#263238" stroke-width="3"/>
  <text x="110" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#1B5E20">A</text>
  <rect x="45" y="200" width="130" height="50" rx="6" fill="#FFF59D" stroke="#9E9E9E"/>
  <text x="110" y="230" text-anchor="middle" font-size="15" fill="#263238">Inicio</text>

  <rect x="250" y="200" width="180" height="50" rx="6" fill="#FFFFFF" stroke="#546E7A" stroke-dasharray="5 3"/>
  <text x="340" y="220" text-anchor="middle" font-size="11" class="mono" fill="#546E7A">savedStateHandle de Inicio</text>
  <text x="340" y="240" text-anchor="middle" font-size="13" class="mono" font-weight="bold" fill="#C62828">"mensaje" → "Hola"</text>
  <line x1="175" y1="225" x2="248" y2="225" stroke="#9E9E9E" stroke-width="1.5"/>

  <path d="M 175 160 C 240 160, 300 160, 320 196" fill="none" stroke="#C62828" stroke-width="2" marker-end="url(#flechaRoja)"/>
  <text x="235" y="285" text-anchor="middle" font-size="12" class="mono" fill="#263238">previousBackStackEntry</text>
  <text x="235" y="303" text-anchor="middle" font-size="12" class="mono" fill="#263238">  ?.savedStateHandle</text>
  <text x="235" y="321" text-anchor="middle" font-size="12" class="mono" fill="#263238">  ?.set("mensaje", "Hola")</text>
  <text x="235" y="345" text-anchor="middle" font-size="12" fill="#546E7A">A escribe en el almacén de la pantalla de debajo</text>

  <!-- Flecha central -->
  <line x1="452" y1="225" x2="543" y2="225" stroke="#37474F" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="497" y="212" text-anchor="middle" font-size="11" class="mono" fill="#263238">popBackStack()</text>

  <!-- Panel derecho: después de volver -->
  <rect x="545" y="70" width="435" height="290" rx="10" fill="#F5F5F5" stroke="#B0BEC5"/>
  <text x="762" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">De vuelta en Inicio</text>
  <text x="762" y="114" text-anchor="middle" font-size="12" fill="#546E7A">pila: [Inicio]</text>

  <rect x="570" y="200" width="130" height="50" rx="6" fill="#FFF59D" stroke="#263238" stroke-width="3"/>
  <text x="635" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Inicio</text>

  <rect x="775" y="200" width="180" height="50" rx="6" fill="#FFFFFF" stroke="#546E7A" stroke-dasharray="5 3"/>
  <text x="865" y="220" text-anchor="middle" font-size="11" class="mono" fill="#546E7A">savedStateHandle de Inicio</text>
  <text x="865" y="240" text-anchor="middle" font-size="13" class="mono" font-weight="bold" fill="#C62828">"mensaje" → "Hola"</text>
  <line x1="700" y1="225" x2="773" y2="225" stroke="#9E9E9E" stroke-width="1.5"/>

  <rect x="580" y="140" width="350" height="36" rx="6" fill="#FFFDE7" stroke="#F9A825"/>
  <text x="755" y="163" text-anchor="middle" font-size="13" fill="#263238">Se ve: «Mensaje de A: Hola»</text>
  <path d="M 865 198 C 865 185, 820 185, 800 178" fill="none" stroke="#C62828" stroke-width="2" marker-end="url(#flechaRoja)"/>

  <text x="762" y="300" text-anchor="middle" font-size="12" class="mono" fill="#263238">backStackEntry.savedStateHandle</text>
  <text x="762" y="318" text-anchor="middle" font-size="12" class="mono" fill="#263238">  .getStateFlow("mensaje", null)</text>
  <text x="762" y="345" text-anchor="middle" font-size="12" fill="#546E7A">Inicio lee su propio almacén y se redibuja con el dato</text>
</svg>
