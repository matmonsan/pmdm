<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#FFFFFF"/>

  <!-- ===== Estado 1 ===== -->
  <rect x="30" y="20" width="220" height="70" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="140" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">uiState</text>
  <text x="42" y="62" font-size="12" font-family="Consolas, Menlo, monospace" fill="#263238">hotelList = [4 hoteles]</text>
  <text x="42" y="80" font-size="12" font-family="Consolas, Menlo, monospace" fill="#263238">selectedHotelId = null</text>
  <line x1="140" y1="92" x2="140" y2="126" stroke="#37474F" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Móvil 1: lista -->
  <rect x="30" y="130" width="220" height="300" rx="20" fill="#263238"/>
  <rect x="40" y="145" width="200" height="270" rx="6" fill="#FAFAFA"/>
  <text x="52" y="170" font-size="14" font-weight="bold" fill="#263238">Mis hoteles</text>
  <rect x="50" y="182" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
  <text x="60" y="207" font-size="12" fill="#263238">Antiguo Palacio de Atienza</text>
  <rect x="50" y="230" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
  <text x="60" y="255" font-size="12" fill="#263238">La Casa del Vaquero</text>
  <rect x="50" y="278" width="180" height="40" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="60" y="303" font-size="12" font-weight="bold" fill="#0D47A1">Hotel Peñalta</text>
  <rect x="50" y="326" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
  <text x="60" y="351" font-size="12" fill="#263238">Hotel Felipe II</text>
  <text x="140" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Se ve PantallaPrincipal</text>
  <text x="140" y="478" text-anchor="middle" font-size="12" fill="#546E7A">(no hay hotel seleccionado)</text>

  <!-- Transición 1 -->
  <line x1="256" y1="300" x2="364" y2="300" stroke="#37474F" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="310" y="270" text-anchor="middle" font-size="12" fill="#C62828">Pulsa</text>
  <text x="310" y="286" text-anchor="middle" font-size="12" fill="#C62828">«Hotel Peñalta»</text>
  <text x="310" y="322" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#37474F">onHotelClicked</text>

  <!-- ===== Estado 2 ===== -->
  <rect x="370" y="20" width="220" height="70" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="480" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">uiState</text>
  <text x="382" y="62" font-size="12" font-family="Consolas, Menlo, monospace" fill="#263238">hotelList = [4 hoteles]</text>
  <text x="382" y="80" font-size="12" font-family="Consolas, Menlo, monospace" fill="#C62828">selectedHotelId = "a1b2"</text>
  <line x1="480" y1="92" x2="480" y2="126" stroke="#37474F" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Móvil 2: detalle -->
  <rect x="370" y="130" width="220" height="300" rx="20" fill="#263238"/>
  <rect x="380" y="145" width="200" height="270" rx="6" fill="#FAFAFA"/>
  <text x="392" y="172" font-size="15" font-weight="bold" fill="#263238">Hotel Peñalta</text>
  <text x="392" y="200" font-size="12" fill="#263238">Ciudad: Bogarra</text>
  <text x="392" y="220" font-size="12" fill="#263238">Provincia: Albacete</text>
  <text x="392" y="240" font-size="12" fill="#263238">Teléfono: 967 98 89 98</text>
  <rect x="392" y="360" width="80" height="32" rx="16" fill="#1565C0"/>
  <text x="432" y="381" text-anchor="middle" font-size="12" fill="#FFFFFF">Volver</text>
  <rect x="484" y="360" width="80" height="32" rx="16" fill="#C62828" stroke="#C62828"/>
  <text x="524" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Borrar</text>
  <text x="480" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Se ve PantallaDetalle</text>
  <text x="480" y="478" text-anchor="middle" font-size="12" fill="#546E7A">(del hotel con id "a1b2")</text>

  <!-- Transición 2 -->
  <line x1="596" y1="300" x2="704" y2="300" stroke="#37474F" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="650" y="278" text-anchor="middle" font-size="12" fill="#C62828">Pulsa «Borrar»</text>
  <text x="650" y="322" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#37474F">onDeleteHotel</text>

  <!-- ===== Estado 3 ===== -->
  <rect x="710" y="20" width="220" height="70" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="820" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">uiState</text>
  <text x="722" y="62" font-size="12" font-family="Consolas, Menlo, monospace" fill="#C62828">hotelList = [3 hoteles]</text>
  <text x="722" y="80" font-size="12" font-family="Consolas, Menlo, monospace" fill="#C62828">selectedHotelId = null</text>
  <line x1="820" y1="92" x2="820" y2="126" stroke="#37474F" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Móvil 3: lista sin Peñalta -->
  <rect x="710" y="130" width="220" height="300" rx="20" fill="#263238"/>
  <rect x="720" y="145" width="200" height="270" rx="6" fill="#FAFAFA"/>
  <text x="732" y="170" font-size="14" font-weight="bold" fill="#263238">Mis hoteles</text>
  <rect x="730" y="182" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
  <text x="740" y="207" font-size="12" fill="#263238">Antiguo Palacio de Atienza</text>
  <rect x="730" y="230" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
  <text x="740" y="255" font-size="12" fill="#263238">La Casa del Vaquero</text>
  <rect x="730" y="278" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
  <text x="740" y="303" font-size="12" fill="#263238">Hotel Felipe II</text>
  <text x="820" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Se ve PantallaPrincipal</text>
  <text x="820" y="478" text-anchor="middle" font-size="12" fill="#546E7A">(ya sin Hotel Peñalta)</text>
</svg>
