<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="540" viewBox="0 0 1000 540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>text { white-space: pre; }</style>
  <defs>
    <marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/>
    </marker>
    <marker id="flechaRoja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C62828"/>
    </marker>
    <marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#FFFFFF"/>

  <!-- MainActivity -->
  <rect x="380" y="12" width="240" height="50" rx="8" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
  <text x="500" y="33" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">MainActivity.kt</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#37474F">setContent { AppPantallas() }</text>
  <line x1="500" y1="64" x2="500" y2="126" stroke="#37474F" stroke-width="2" marker-end="url(#flechaGris)"/>

  <!-- AppPantallas -->
  <rect x="370" y="130" width="260" height="240" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="500" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1B5E20">AppPantallas.kt</text>
  <text x="500" y="177" text-anchor="middle" font-size="12" fill="#2E7D32">decide qué pantalla se ve</text>
  <rect x="385" y="190" width="230" height="165" rx="6" fill="#FFFFFF" stroke="#A5D6A7"/>
  <text x="395" y="212" font-size="12" font-family="Consolas, Menlo, monospace" fill="#C62828">var idSeleccionado by</text>
  <text x="395" y="230" font-size="12" font-family="Consolas, Menlo, monospace" fill="#C62828">  rememberSaveable {...}</text>
  <text x="395" y="260" font-size="12" font-family="Consolas, Menlo, monospace" fill="#263238">if (hotelSeleccionado</text>
  <text x="395" y="278" font-size="12" font-family="Consolas, Menlo, monospace" fill="#263238">      == null)</text>
  <text x="395" y="296" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1565C0">  PantallaPrincipal(...)</text>
  <text x="395" y="318" font-size="12" font-family="Consolas, Menlo, monospace" fill="#263238">else</text>
  <text x="395" y="336" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1565C0">  PantallaDetalle(...)</text>

  <!-- ===== Lado izquierdo: PantallaPrincipal ===== -->
  <rect x="20" y="110" width="190" height="310" rx="20" fill="#263238"/>
  <rect x="30" y="125" width="170" height="280" rx="6" fill="#FAFAFA"/>
  <text x="42" y="152" font-size="14" font-weight="bold" fill="#263238">Mis hoteles</text>
  <rect x="40" y="166" width="150" height="38" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
  <text x="50" y="190" font-size="12" fill="#263238">La Casa del Vaquero</text>
  <rect x="40" y="212" width="150" height="38" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="50" y="236" font-size="12" font-weight="bold" fill="#0D47A1">Hotel Peñalta</text>
  <rect x="40" y="258" width="150" height="38" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
  <text x="50" y="282" font-size="12" fill="#263238">Hotel Felipe II</text>
  <text x="115" y="445" text-anchor="middle" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#0D47A1">PantallaPrincipal.kt</text>

  <!-- AppPantallas -> PantallaPrincipal (se dibuja) -->
  <line x1="368" y1="200" x2="214" y2="200" stroke="#1565C0" stroke-width="2.5" marker-end="url(#flechaAzul)"/>
  <text x="290" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">Se dibuja si</text>
  <text x="290" y="189" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1565C0">idSeleccionado == null</text>

  <!-- PantallaPrincipal -> AppPantallas (evento) -->
  <line x1="214" y1="320" x2="366" y2="320" stroke="#C62828" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#flechaRoja)"/>
  <text x="290" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#C62828">Pulsa un hotel</text>
  <text x="290" y="309" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#C62828">onHotelClick(hotel)</text>
  <text x="290" y="340" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#263238">idSeleccionado</text>
  <text x="290" y="356" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#263238">= hotel.id</text>

  <!-- ===== Lado derecho: PantallaDetalle ===== -->
  <rect x="790" y="110" width="190" height="310" rx="20" fill="#263238"/>
  <rect x="800" y="125" width="170" height="280" rx="6" fill="#FAFAFA"/>
  <text x="812" y="152" font-size="14" font-weight="bold" fill="#263238">Hotel Peñalta</text>
  <text x="812" y="180" font-size="12" fill="#263238">Ciudad: Bogarra</text>
  <text x="812" y="200" font-size="12" fill="#263238">Provincia: Albacete</text>
  <text x="812" y="220" font-size="12" fill="#263238">Tel.: 967 98 89 98</text>
  <rect x="845" y="355" width="80" height="32" rx="16" fill="#1565C0"/>
  <text x="885" y="376" text-anchor="middle" font-size="12" fill="#FFFFFF">Volver</text>
  <text x="885" y="445" text-anchor="middle" font-size="13" font-weight="bold" font-family="Consolas, Menlo, monospace" fill="#0D47A1">PantallaDetalle.kt</text>

  <!-- AppPantallas -> PantallaDetalle (se dibuja) -->
  <line x1="632" y1="200" x2="786" y2="200" stroke="#1565C0" stroke-width="2.5" marker-end="url(#flechaAzul)"/>
  <text x="710" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">Se dibuja si</text>
  <text x="710" y="189" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#1565C0">idSeleccionado != null</text>

  <!-- PantallaDetalle -> AppPantallas (evento) -->
  <line x1="786" y1="320" x2="634" y2="320" stroke="#C62828" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#flechaRoja)"/>
  <text x="710" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#C62828">Pulsa «Volver»</text>
  <text x="710" y="292" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#C62828">onVolver()</text>
  <text x="710" y="309" text-anchor="middle" font-size="11" fill="#C62828">o Atrás (BackHandler)</text>
  <text x="710" y="340" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#263238">idSeleccionado</text>
  <text x="710" y="356" text-anchor="middle" font-size="11" font-family="Consolas, Menlo, monospace" fill="#263238">= null</text>

  <!-- Leyenda / nota -->
  <rect x="190" y="470" width="620" height="56" rx="8" fill="#FFFDE7" stroke="#F9A825"/>
  <text x="500" y="493" text-anchor="middle" font-size="13" fill="#263238">Las pantallas no se conocen entre sí: solo avisan con eventos.</text>
  <text x="500" y="513" text-anchor="middle" font-size="13" fill="#263238">AppPantallas es el único que cambia idSeleccionado y elige qué pantalla se dibuja.</text>
</svg>
